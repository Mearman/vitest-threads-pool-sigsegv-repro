name: Reproduce threads-pool SIGSEGV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite_size:
        description: "Number of generated feature+test file pairs"
        default: "20000"
      blob_kb:
        description: "Per-file synthetic data blob size (KB)"
        default: "24"

jobs:
  threads-pool-crash:
    name: pool "threads" (node ${{ matrix.node }}) -- expected to crash
    runs-on: macos-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    env:
      SUITE_SIZE: ${{ inputs.suite_size || '20000' }}
      SUITE_BLOB_KB: ${{ inputs.blob_kb || '24' }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run generate
      - name: Run under pool "threads", maxWorkers 1
        id: threads
        run: |
          set +e
          node repro-threads.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Process exited with code $code"
          if [ "$code" -gt 128 ]; then
            signal=$((code - 128))
            echo "Terminated by signal $signal (128+$signal)."
          fi
      - name: Report reproduction status
        run: |
          code="${{ steps.threads.outputs.exit_code }}"
          if [ "$code" -eq 139 ]; then
            echo "REPRODUCED: the process was killed by SIGSEGV (exit code 139), matching vitest-dev/vitest#11291 exactly."
            exit 0
          fi
          if [ "$code" -gt 128 ]; then
            signal=$((code - 128))
            echo "NOT A MATCH: the process was killed by signal $signal (exit code $code), not SIGSEGV (signal 11, exit code 139). Signal 6 (SIGABRT, exit code 134) most often means a V8 'JavaScript heap out of memory' abort -- a different, mundane failure mode from the crash this repo targets; check the job log for 'FATAL ERROR' to confirm. If this keeps happening, the suite is hitting a heap ceiling before it can reach whatever GC condition trips the real bug -- try NODE_OPTIONS=--max-old-space-size=<larger>, or a suite shape that finishes collection/transform quickly with fast test bodies rather than one that runs for hours."
            exit 1
          fi
          echo "NOT REPRODUCED this run: process exited cleanly with code $code. See README for details, and re-run the workflow (optionally at a larger SUITE_SIZE/SUITE_BLOB_KB via workflow_dispatch) if you want to try again."
          exit 1

  forks-pool-comparison:
    name: pool "forks" (node ${{ matrix.node }}) -- expected to pass cleanly
    runs-on: macos-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    env:
      SUITE_SIZE: ${{ inputs.suite_size || '20000' }}
      SUITE_BLOB_KB: ${{ inputs.blob_kb || '24' }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run generate
      - name: Run under pool "forks", maxWorkers 1 (same file set, same Node API call)
        run: node repro-forks.mjs
