version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # This repo's whole point is pinning the exact versions from the original bug report -- bumping them would defeat the reproduction.
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/mocker"
